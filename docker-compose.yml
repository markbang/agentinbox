# Self-hosting: put AGENTINBOX_MASTER_KEY (openssl rand -base64 32) and other settings in .env, then `docker compose up -d`.
services:
  server:
    image: ghcr.io/markbang/agentinbox-server:latest
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # The old NSHMAIL_MASTER_KEY in an existing .env still works.
      AGENTINBOX_MASTER_KEY: ${AGENTINBOX_MASTER_KEY:-${NSHMAIL_MASTER_KEY:?set AGENTINBOX_MASTER_KEY in .env (openssl rand -base64 32)}}
    volumes:
      - data:/data

volumes:
  data:
